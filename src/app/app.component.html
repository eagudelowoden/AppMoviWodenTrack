<ion-app>
  <div class="offline-banner" *ngIf="!online">
    Nuestros servicios no están disponibles. Espera un momento mientras terminamos…
  </div>

  <!-- Bienvenida al abrir la app -->
  <div class="welcome-screen" [class.is-hiding]="!showWelcome" *ngIf="showWelcome">
    <span class="welcome-letter">W</span>
    <p class="welcome-title">Bienvenido</p>
    <p class="welcome-sub">WodenTrack</p>
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <ion-router-outlet></ion-router-outlet>
</ion-app>
