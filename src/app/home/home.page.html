<ion-content [fullscreen]="true" class="login-content">
  <div class="login-screen">
    <!-- ══ ZONA OSCURA — Navy + malla ═══════════════════════════════════════ -->
    <div class="login-top">

      <!-- Sin usuario recordado: marca por defecto -->
      <ng-container *ngIf="!lastUser">
        <div class="brand">
          <span class="brand-letter">W</span>
          <div class="brand-text">
            <span class="b-woden">Woden</span><span class="b-track">Track</span>
          </div>
        </div>
        <p class="login-sub">Sistema de Asistencias</p>
      </ng-container>

      <!-- Con usuario recordado: saludo fijo, sin reloj ni ícono -->
      <div class="brand" *ngIf="lastUser">
        <span class="brand-letter">W</span>
        <p class="login-greeting">¡Hola, {{ primerNombre }}!</p>
      </div>
    </div>

    <!-- ══ HOJA BLANCA — Formulario ═════════════════════════════════════════ -->
    <div class="login-bottom">
      <h2 class="form-title">Iniciar sesión</h2>

      <!-- Usuario -->
      <div class="field-wrap">
        <div class="field-icon">
          <ion-icon name="person-outline"></ion-icon>
        </div>
        <ion-input
          class="field-input"
          type="text"
          placeholder="Usuario"
          [(ngModel)]="userForm.usuario"
          autocomplete="username"
        >
        </ion-input>
      </div>

      <!-- Contraseña -->
      <div class="field-wrap">
        <div class="field-icon">
          <ion-icon name="lock-closed-outline"></ion-icon>
        </div>
        <ion-input
          class="field-input"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Contraseña"
          [(ngModel)]="userForm.password"
          autocomplete="current-password"
        >
        </ion-input>
        <button class="eye-btn" (click)="togglePassword()">
          <ion-icon
            [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
          ></ion-icon>
        </button>
      </div>

      <!-- Botón ingresar -->
      <button class="btn-ingresar" (click)="ingresar()">Ingresar</button>

      <!-- Aviso de actualización — misma barra que en Marcación -->
      <div class="update-banner" *ngIf="apkInfo && showUpdateBanner" (click)="downloadUpdate()">
        <ion-icon [name]="downloading ? 'cloud-download-outline' : 'megaphone-outline'"></ion-icon>
        <div class="ub-text">
          <ng-container *ngIf="!downloading">
            <span class="ub-title">Nueva actualización disponible</span>
            <span class="ub-sub">Versión {{ apkInfo.version }} · Toca para descargar</span>
          </ng-container>
          <ng-container *ngIf="downloading">
            <span class="ub-title">Descargando actualización…</span>
            <span class="ub-sub">{{ downloadProgress }}%</span>
          </ng-container>
        </div>
        <button class="ub-dismiss" *ngIf="!downloading" (click)="$event.stopPropagation(); dismissUpdate()">
          <ion-icon name="close-outline"></ion-icon>
        </button>
      </div>

      <p class="version-label">WodenTrack Pro · v{{ appVersion }}</p>
    </div>
  </div>
</ion-content>
